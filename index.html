svg.ch{width:100%;height:auto}
.ov{position:fixed;inset:0;z-index:50;background:linear-gradient(180deg,var(--h1),var(--b2));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;text-align:center}

<script>
(function(){

function nn(e){return{id:String(e.id).slice(0,40),date:e.date,type:["reflect","grat","insight"].indexOf(e.type)>-1?e.type:"reflect",text:String(e.text||"").slice(0,5000)}}
function okd(e){return e&&e.id!=null&&/^\d{4}-\d{2}-\d{2}$/.test(e.date)}
function init(){try{var o=JSON.parse(localStorage.getItem(K)||"null");if(o){D.entries=(o.entries||[]).filter(okd).map(ne);D.notes=(o.notes||[]).filter(okd).map(nn);D.city=String(o.city||"").slice(0,60);D.name=String(o.name||"").slice(0,40);D.shift=String(o.shift||"").slice(0,600);D.hs=!!o.hs}}catch(e){}
 var l=null;try{l=localStorage.getItem("is-lang")}catch(e){}S.lang=l||((navigator.language||"").slice(0,2)==="id"?"id":"en")}
function asc(a){return a.slice().sort(function(x,y){return x.date<y.date?-1:x.date>y.date?1:x.id<y.id?-1:1})}
function LG(){return '<div class="lg"><button class="'+(S.lang==="id"?"on":"")+'" data-a="lang" data-v="id">ID</button><button class="'+(S.lang==="en"?"on":"")+'" data-a="lang" data-v="en">EN</button></div>'}
function top(ti){return '<div class="tb"><h1>'+ti+'</h1>'+LG()+'</div>'}
function back(a,v){return '<div style="padding-top:16px"><button class="btn g" style="width:auto;padding:0" data-a="'+a+'"'+(v?' data-v="'+v+'"':'')+'>‹ '+t("Kembali","Back")+'</button></div>'}
var HL='<svg viewBox="0 0 400 220" preserveAspectRatio="none" aria-hidden="true"><circle cx="330" cy="58" r="17" fill="#FFF3D6" opacity=".9"/><path d="M0 150Q80 110 160 140T320 130T400 140V220H0Z" fill="#CBBDEB" opacity=".7"/><path d="M0 172Q100 130 200 166T400 156V220H0Z" fill="#B7A5E3" opacity=".85"/><path d="M0 196Q120 166 240 194T400 184V220H0Z" fill="#9F8BD6"/></svg>';
function homeV(){var d=new Date(),h=d.getHours(),g=h<11?["Selamat pagi","Good morning"]:h<15?["Selamat siang","Good afternoon"]:h<18?["Selamat sore","Good afternoon"]:["Selamat malam","Good evening"];
 return '<div class="hero">'+HL+'<div class="hg"><div class="hb">'+LG()+'</div><h1>'+t(g[0],g[1])+(D.name?", "+esc(D.name):"")+'</h1><p>'+d.toLocaleDateString(loc(),{weekday:"long",day:"numeric",month:"long"})+'</p></div></div>'
 +'<div class="cd pull"><div class="row rs"><div><h3>'+t("Tenang dulu","Find some calm")+'</h3><div class="mu">'+t("Tarik napas 4 hitungan, buang 6.","Breathe in for 4, out for 6.")+'</div></div><button class="chip on" data-a="br">'+t("Napas 1 menit","1-min breathing")+'</button></div></div>'
 +'<div class="cd"><h3>'+t("Bagaimana kabarmu hari ini?","How are you today?")+'</h3><div class="mo">'+MJ.map(function(m,i){return '<button class="mb'+(S.mood===i+1?" on":"")+'" data-a="mood" data-v="'+(i+1)+'" aria-label="'+t(ML[i][0],ML[i][1])+'">'+m+'<small>'+t(ML[i][0],ML[i][1])+'</small></button>'}).join("")+'</div><button class="btn" data-a="go">'+t("Lanjut","Continue")+' →</button></div>'
 +'<p class="mu">'+t("InnerSpace adalah alat refleksi, bukan diagnosis atau terapi. Jika terasa terlalu berat atau kamu berpikir untuk menyakiti diri, hubungi layanan darurat setempat atau orang yang kamu percaya.","InnerSpace is a reflection tool, not a diagnosis or therapy. If things feel too heavy or you are thinking of harming yourself, contact local emergency services or someone you trust.")+'</p>'}
function brV(){return '<div class="ov"><h2 id="bt">'+t("Tarik napas","Breathe in")+'</h2><div class="bc"></div><div class="mu" id="bs">60</div><button class="btn" style="max-width:260px" data-a="brx">'+t("Selesai","Done")+'</button></div>'}
function pathV(){return back("back")+'<h2 style="margin:8px 0 4px;font-size:28px">'+t("Mau menulis apa?","What would you like to write?")+'</h2>'+(S.mood?'<div class="mu">'+t("Suasana hati hari ini: ","Today’s mood: ")+MJ[S.mood-1]+' '+t(ML[S.mood-1][0],ML[S.mood-1][1])+'</div>':'')
 +'<button class="op on" data-a="safe"><i>🛡️</i><div><b>'+t("Ruang Aman untuk Diriku","A Safe Space for Me")+'</b><span>'+t("Enam pertanyaan, semuanya boleh dilewati. Jawabanmu menjadi bahan Wawasan.","Six questions, all skippable. Your answers feed your Insights.")+'</span></div></button>'
 +'<button class="op" data-a="free"><i>✍️</i><div><b>'+t("Cerita bebas","Free writing")+'</b><span>'+t("Refleksi, rasa syukur, atau insight hari ini. Disimpan sebagai catatan sendiri.","Reflection, gratitude, or today’s insight. Saved as your own note.")+'</span></div></button>'
 +'<button class="btn g" data-a="mo">'+t("Simpan suasana hati saja","Just save my mood")+'</button>'}
function sl(f,lab,mn,mx){var v=S.dr[f];return '<div class="sm" style="margin:16px 0 6px">'+lab+'</div><div class="row"><input type="range" style="flex:1;width:auto" min="'+mn+'" max="'+mx+'" value="'+(v==null?Math.round((mn+mx)/2):v)+'" data-f="'+f+'"><span class="val" id="v_'+f+'">'+(v==null?"—":v)+'</span><button class="chip" data-a="clr" data-v="'+f+'" aria-label="'+t("Kosongkan","Clear")+'">×</button></div>'}
function safeV(){var st=S.st,d=S.dr,h=back("sb");
 if(st===0)return h+'<div class="cd"><h2>'+t("Ruang Aman untuk Diriku","A Safe Space for Me")+'</h2><p class="mu">'+t("Enam pertanyaan. Kamu boleh melewati yang mana pun dan berhenti kapan saja.","Six questions. Skip any of them and stop whenever you like.")+'</p>'+sl("int",t("Seberapa kuat perasaanmu sekarang? (0–10, opsional)","How strong does this feel right now? (0–10, optional)"),0,10)+'<button class="btn" style="margin-top:20px" data-a="sn">'+t("Mulai","Start")+'</button></div>';
 if(st>=1&&st<=6)return h.replace('data-a="sb"','data-a="sb"')+'<div class="row rs mu"><span>'+t("Ruang Aman untuk Diriku","A Safe Space for Me")+'</span><span>'+st+' / 6</span></div><div class="pr" style="margin-top:6px"><i style="width:'+Math.round(st/6*100)+'%"></i></div><div class="cd"><h2 style="font-size:24px">'+t(QS[st-1][0],QS[st-1][1])+'</h2><textarea data-q="1" style="margin-top:14px" placeholder="'+t("Tulis seadanya. Satu kalimat pun cukup.","Write whatever comes. One sentence is enough.")+'">'+esc(d.a[st-1])+'</textarea><button class="btn" style="margin-top:14px" data-a="sn">'+t("Lanjut","Next")+'</button><button class="btn g" data-a="sn">'+t("Lewati pertanyaan ini","Skip this question")+'</button></div>';
 if(st===7)return h+'<div class="cd"><h2>'+t("Kata mana yang terasa paling dekat?","Which words feel closest?")+'</h2><p class="mu">'+t("Pilih satu atau lebih, tulis kata sendiri, atau belum tahu.","Pick any, write your own, or not sure yet.")+'</p><div class="row">'+EM.map(function(x){return '<button class="chip'+(d.emo.indexOf(x[0])>-1?" on":"")+'" data-a="emo" data-v="'+x[0]+'">'+el(x[0])+'</button>'}).join("")+d.emo.filter(function(k){return !EM.some(function(x){return x[0]===k})}).map(function(k){return '<button class="chip on" data-a="emo" data-v="'+esc(k)+'">'+esc(k)+'</button>'}).join("")+'</div><div class="row" style="margin-top:10px"><input type="text" id="ce" style="flex:1;width:auto" placeholder="'+t("Kata lain…","Another word…")+'"><button class="chip" data-a="addemo">'+t("Tambah","Add")+'</button></div>'+sl("aft",t("Setelah menulis, seberapa kuat perasaanmu? (0–10, opsional)","After writing, how strong does it feel? (0–10, optional)"),0,10)+'<button class="btn" style="margin-top:20px" data-a="fin">'+t("Selesai","Finish")+'</button></div>';

function freeV(){var n=S.nt,ty=NT.filter(function(x){return x[0]===n.type})[0];

function chart(es,c){var W=320,H=120,P=14,t0=pd(c).getTime(),span=Math.max(864e5,pd(ds(new Date())).getTime()-t0);
